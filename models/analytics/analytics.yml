version: 2

models:
  - name: dim_transit_stations
    description: "Station dimension for TriMet/Portland."
    columns:
      - name: station_id
        description: "Business key for the station."
        tests:
          - not_null
          - unique
      - name: station_name
        description: "Human-readable station name."
      - name: station_lat
        description: "Latitude of the station."
      - name: station_lon
        description: "Longitude of the station."

  - name: fct_crime_events
    description: "One row per crime event with standardized columns."
    columns:
      - name: crime_sk
        description: "Surrogate key for the crime event."
        tests:
          - unique
      - name: occurred_date
        description: "Date the crime occurred."
        tests:
          - not_null
      - name: offense_type
        description: "Categorized offense type."
      - name: crime_lat
        description: "Latitude of the crime (if available)."
      - name: crime_lon
        description: "Longitude of the crime (if available)."
      - name: station_id
        description: "If present, station directly linked to the crime."

  - name: fct_crime_by_day
    description: "Daily crime counts."
    columns:
      - name: occurred_date
        tests:
          - not_null
          - unique
      - name: crime_count

  - name: fct_crime_by_week
    description: "Weekly crime counts (week_start = Monday per Snowflake)."
    columns:
      - name: week_start
        tests:
          - not_null
          - unique
      - name: crime_count

  - name: fct_crime_by_station__key
    description: "Crime counts per station using station_id key join."
    columns:
      - name: station_id
        tests:
          - not_null
          # If this model yields exactly one row per station, also add:
          # - unique
          # And enforce referential integrity to the dimension:
          # - relationships:
          #     to: ref('dim_transit_stations')
          #     field: station_id
      - name: station_name
      - name: station_lat
      - name: station_lon
      - name: crime_count

  - name: fct_crime_by_station__closest
    description: "Crime counts per station by assigning each crime to its nearest station (geospatial)."
    columns:
      - name: station_id
        tests:
          - not_null
          # Optional referential integrity test:
          # - relationships:
          #     to: ref('dim_transit_stations')
          #     field: station_id
      - name: station_name
      - name: station_lat
      - name: station_lon
      - name: crime_count
      - name: avg_distance_m
        description: "Average distance in meters from crimes to the assigned station (only RN=1)."
