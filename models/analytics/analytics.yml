version: 2

models:
  - name: dim_transit_stations
    description: "Station dimension built from transit stops (synthetic key)."
    columns:
      - name: station_id
        tests: [not_null, unique]
      - name: station_lat
        tests: []
      - name: station_lon
        tests: []

  - name: fct_crime_events
    description: "One row per crime event, standardized columns."
    columns:
      - name: crime_sk
        tests: [not_null, unique]
      - name: occurred_date
        tests: [not_null]

  - name: fct_crime_by_day
    description: "Daily crime counts."
    columns:
      - name: occurred_date
        tests: [not_null, unique]

  - name: fct_crime_by_week
    description: "Weekly crime counts."
    columns:
      - name: week_start
        tests: [not_null, unique]

  - name: fct_crime_by_station__closest
    description: "Crimes assigned to nearest station via GEOGRAPHY distance."
    columns:
      - name: station_id
        tests: [not_null]
      - name: crime_count
        tests: []
