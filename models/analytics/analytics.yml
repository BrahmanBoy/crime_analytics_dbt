version: 2

models:
  - name: dim_transit_stations
    description: "Station dimension for TriMet/Portland."
    columns:
      - name: station_id
        tests: [not_null, unique]
      - name: station_lat
        tests: []
      - name: station_lon
        tests: []

  - name: fct_crime_events
    description: "One row per crime event with standardized columns."
    columns:
      - name: crime_sk
        tests: [not_null, unique]
      - name: occurred_date
        tests: [not_null]
      - name: crime_lat
        tests: []
      - name: crime_lon
        tests: []
      - name: station_id
        tests: []   # add relationship if you rely on key-join
    tests: []

  - name: fct_crime_by_day
    description: "Daily crime counts."
    columns:
      - name: occurred_date
        tests: [not_null, unique]
      - name: crime_count
        tests: []

  - name: fct_crime_by_week
    description: "Weekly crime counts."
    columns:
      - name: week_start
        tests: [not_null, unique]

  - name: fct_crime_by_station__key
    description: "Crime counts per station using station_id key."
    columns:
      - name: station_id
        tests: [not_null]   # add unique if every station appears once
      - name: crime_count
        tests: []

  - name: fct_crime_by_station__closest
    description: "Crime counts per station via nearest-station (geospatial)."
    columns:
      - name: station_id
        tests: [not_null]
      - name: crime_count
        tests: []
