name: "crime_dbt"
version: "1.0.0"
config-version: 2

profile: "crime_profile"   # dbt Core: must match your profiles.yml entry
# dbt Cloud: set Database=CRIME_DB, Warehouse=COMPUTE_WH, User=BRAHMANBOY in the connection

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["models"]
snapshot-paths: ["snapshots"]
seed-paths: ["seeds"]
analysis-paths: ["analyses"]

models:
  crime_dbt:
    +materialized: view
    +database: CRIME_DB
    +schema: ANALYTICS
    staging:
      +tags: ["staging"]
