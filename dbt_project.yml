# dbt_project.yml
name: 'my_new_project'
version: '1.0.0'
config-version: 2

# Which profile to use (as defined in profiles.yml / dbt Cloud connection)
profile: 'default'

# Project paths
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

# Build artifacts / clean targets
target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# Model configurations
models:
  my_new_project:                # must match "name" above
    +database: CRIME_DB          # write models to CRIME_DB
    +schema: ANALYTICS           # …and into the ANALYTICS schema
    +materialized: view          # default materialization

    staging:
      +materialized: view        # explicit for staging models

    # Optional example folder override—keep only if you use models/example/*
    example:
      +materialized: table
